<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хрестики-Нулики</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h1>Хрестики-Нулики</h1>
        
        <!-- Блок мережевого підключення -->
        <div class="network-controls" style="margin: 15px auto; padding: 15px; border: 1px solid #ccc; border-radius: 8px; max-width: 300px;">
            <p>Ваш ID для друга: <strong id="my-id" style="color: #dc3545;">Завантаження...</strong></p>
            <input type="text" id="friend-id" placeholder="Введіть ID друга" style="width: 140px; padding: 4px;">
            <button onclick="connectToFriend()" style="padding: 4px 8px; cursor: pointer;">Підключитися</button>
        </div>

        <!-- Головне інформаційне табло для онлайну -->
        <div id="net-status" style="font-weight: bold; margin: 10px; color: #007bff;">З'єднання з мережею...</div>

        <!-- Меню выбора режима -->
        <div id="menu">
            <button id="btn-vs-player">Грати з другом (Локально)</button>
            <button id="btn-vs-ai">Грати проти ІІ</button>
            
            <div id="ai-settings" class="hidden">
                <label for="difficulty">Складність:</label>
                <select id="difficulty">
                    <option value="easy">Легкий</option>
                    <option value="medium">Середній</option>
                    <option value="hard">Складний (Неможливо перемогти)</option>
                </select>
                <button id="start-ai-game">Почати гру</button>
            </div>
        </div>

        <!-- Игровое поле -->
        <div id="game-area" class="hidden">
            <!-- Изменили id со status на game-status, чтобы код не ломался -->
            <h2 id="game-status">Хід гравця X</h2>
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
            <button id="btn-restart">Почати знову</button>
            <button id="btn-back">До меню</button>
        </div>
    </div>

    <!-- ВАЖНО: Правильное подключение библиотеки PeerJS перед твоим скриптом -->
<script src="js/peerjs.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
